name: Build book

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PANDOC_VERSION: "3.11"
  TYPST_VERSION: "v0.15.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach files to a release on tag push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - name: Install typst
        run: |
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          sudo install -m 0755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install calibre and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre fonts-dejavu-core fonts-liberation
          ebook-convert --version | head -1

      - name: Build PDF, EPUB and MOBI
        run: make pdf epub mobi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual
          path: |
            build/manual.pdf
            build/manual.epub
            build/manual.mobi
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/manual.pdf
            build/manual.epub
            build/manual.mobi
